variables:
  # Directory variables
  # https://www.gnu.org/prep/standards/html_node/Directory-Variables.html#Directory-Variables
  DESTDIR: ""
  prefix: "${TREE_PATH}/${target-path}"
  bindir: "${prefix}/bin"
  incdir: "${prefix}/include"
  libdir: "${prefix}/lib"
  # Everything else
  build-mode: debug
  build-dir: build/${build-mode}
  gid: $ id -g
  git-describe-abbrev: "--abbrev=10"
  git-describe-always: "--always"
  git-describe-first-parent: "--first-parent"
  git-describe-tags: "--tags"
  git-describe-match: ""
  git-describe-args: "${git-describe-first-parent} ${git-describe-abbrev} ${git-describe-always} ${git-describe-tags} ${git-describe-match}"
  git-describe-version: $ git describe ${git-describe-args}
  git-remote: origin
  num-procs: $ nproc 2>/dev/null || sysctl -n hw.activecpu 2>/dev/null || echo 4
  python: python3
  py-activate: |
    if test -z "${py-is-virtualenv}" && test -f "${py-venv}/bin/activate"
    then
        source "${py-venv}/bin/activate"
    fi
  py-is-virtualenv: |
    $ ${python} -c '
    import os, sys
    if sys.prefix != sys.base_prefix or os.environ.get("VIRTUAL_ENV"):
        print("true")
    '
  py-pip-editable: "--editable"
  py-pip-upgrade: ""
  py-version: $ ${python} -c 'import sysconfig as sc; print(sc.get_python_version())'
  py-version-brief: $ ${python} -c 'import sys; print("%s%s" % sys.version_info[:2])'
  py-venv: env${py-version-brief}
  py-venv-args: ""
  target-path: "target/${build-mode}"
  uid: $ id -u
  version: "${git-describe-version}"
...
