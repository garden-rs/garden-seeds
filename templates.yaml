garden:
  includes: variables.yaml

templates:
  bin:
    description: Add ${TREE_PATH}/bin to $PATH.
    environment:
      PATH: "${TREE_PATH}/bin"

  bindir:
    description: Add ${bindir} to $PATH.
    environment:
      PATH: "${bindir}"

  libdir:
    description: Add ${libdir} to $LD_LIBRARY_PATH
    environment:
      LD_LIBRARY_PATH: "${libdir}"

  cmake:
    description: Build a generic cmake project
    extend:
      - bindir
      - libdir
    environment:
      CMAKE_PREFIX_PATH: ${prefix}
    variables:
      cmake-ccache: ""  # Set to "ccache" to enable ccache.
      cmake-c-launcher: "${cmake-ccache}"
      cmake-cxx-launcher: "${cmake-ccache}"
      # cmake-build-type maps ${build-mode} to an appropriate CMAKE_BUILD_TYPE.
      # Variants on "dbg" map to "Debug".
      # Variants on "opt/optimize/rel/release" map to "Release".
      # All other values, including the default "debug" value, map to "RelWithDebInfo".
      cmake-build-type: |
        $ case "${build-mode}" in
        *dbg*)
          echo Debug
          ;;
        *opt*|*rel*)
          echo Release
          ;;
        *)
          echo RelWithDebInfo
          ;;
        esac
      cmake-generator: Ninja
      cmake-setup-args: ""
    commands:
      cmake/setup: |
        cmake \
            -S . \
            -G "${cmake-generator}" \
            -B "${build-dir}" \
            -D CMAKE_INSTALL_PREFIX="${prefix}" \
            -D CMAKE_BUILD_TYPE=${cmake-build-type} \
            -D CMAKE_C_COMPILER_LAUNCHER="${cmake-c-launcher}" \
            -D CMAKE_CXX_COMPILER_LAUNCHER="${cmake-cxx-launcher}" \
            -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D CMAKE_INSTALL_MESSAGE=NEVER \
            ${cmake-setup-args}
      build: cmake --build "${build-dir}" -j${num-procs}
      install: cmake --install "${build-dir}"
      setup>:
        - cmake/setup
        - setup/compile-commands

  git-annex-ignore:
    description: |
      Configure git-annex to ignore the origin repository. This is needed when
      origin contains only metadata and the data is replacated across multiple worktrees
      using git-annex.
    variables:
      git-annex-ignore-remote: origin
    gitconfig:
      remote.${git-annex-ignore-remote}.annex-ignore: true
      remote.${git-annex-ignore-remote}.annex-sync: false

  makefile:
    extend:
      - bindir
      - libdir
    variables:
      make-args: ""
      make-cmd: make -j${num-procs} DESTDIR="${DESTDIR}" prefix="${prefix}" ${make-args}
    commands:
      build: ${make-cmd} all "$@"
      install: ${make-cmd} install "$@"
      test: ${make-cmd} test "$@"

  meson:
    extend:
      - bindir
      - libdir
    variables:
      name: ""
      meson-setup-args: ""
      meson-test-args: ""
      meson-test-test-args: ""
    commands:
      meson/setup: |
        if test -d "${build-dir}"
        then
            meson_reconfigure=--reconfigure
        fi
        meson setup $meson_reconfigure \
          --prefix="${prefix}" ${meson-setup-args} "${build-dir}" "$@"
      build: meson compile -C "${build-dir}" "$@"
      install: meson install -C "${build-dir}" "$@"
      setup>:
        - meson/setup
        - setup/compile-commands
      test: |
        meson test -v -C "${build-dir}" ${meson-test-args} \
            --test-args="${meson-test-test-args}" ${test} "$@"
      test/list: meson test -C "${build-dir}" --list
      test/name: |
        if test -z "${name}"
        then
            echo "error: specify a test name, e.g. garden test/name -D name=9003"
            exit 0
        fi
        test_name=$(meson test -C "${build-dir}" --list | grep "${name}")
        meson test -C "${build-dir}" ${meson-test-args} \
            --test-args="${meson-test-test-args}" $test_name "$@"

  python:
    description: |
      Setup a Python virtualenv named after the current Python version.
      Add envXY/bin to ${PATH} to activate the virtualenv.
      Add ${TREE_PATH} to ${PYTHONPATH} to make the modules available.
    environment:
      PATH: ${TREE_PATH}/${py-venv}/bin
      PYTHONPATH: "${TREE_PATH}"
    commands:
      setup: |
        test -d "${py-venv}" || "${python}" -m venv ${py-venv-args} "${py-venv}"
        ${py-activate}
        if test -n "${py-pip-upgrade}"
        then
            pip install --upgrade pip
            pip install --upgrade setuptools
        fi
      dev: |
        ${py-activate}
        pip install ${py-pip-editable} .

  rust:
    variables:
      cargo-build-args: ""
      cargo-build-release: $ test "${build-mode}" = "release" && printf '%s' --release
      cargo-install-args: ""
      cargo-install-release: $ test "${build-mode}" = "release" && printf '%s' --release
      cargo-test_args: ""
    environment:
      PATH: "${TREE_PATH}/${target-path}"
    commands:
      build: cargo build --jobs ${num-procs} ${cargo-build-release} ${cargo-build-args} "$@"
      check: |
        cargo check --jobs ${num-procs} "$@"
        cargo clippy --all -- -D warnings
        cargo fmt --check
      check/clippy: cargo clippy --fix "$@" -- -D warnings
      check/fmt: cargo fmt --check "$@"
      clean: cargo clean "$@"
      doc: cargo doc --jobs ${num-procs} "$@"
      fmt: cargo fmt "$@"
      install: cargo install ${cargo-install-release} ${cargo-install-args} --path . "$@"
      publish: cargo publish "$@"
      run: cargo run "$@"
      test: cargo test --jobs ${num-procs} ${cargo-test-args} "$@"
      update: cargo update "$@"

commands:
  setup/compile-commands: |
    if type realpath >/dev/null && test -f "${compile-commands-json}"
    then
        rm -f "${compile-commands-json-link}"
        symlink_to=$(realpath --relative-to="${build-top-dir}" "${compile-commands-json}")
        ln -s "$symlink_to" "${compile-commands-json-link}"
    fi
...
